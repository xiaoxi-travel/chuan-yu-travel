<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅游城市天气对比看板 | 2026年6月15-21日</title>
<style>
  :root {
    --bg-deep: #0A1A2F;
    --bg-card: #0F2338;
    --bg-card-hover: #152B45;
    --border: #1A3350;
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent-blue: #5B9BD5;
    --accent-orange: #E5C18A;
    --gradient-blue: linear-gradient(135deg, #1e3a5f, #0d1b2a);
    --gradient-orange: linear-gradient(135deg, #3d2e0a, #1a1405);
    --gradient-mixed: linear-gradient(135deg, #1e3a5f 0%, #3d2e0a 100%);
    --shadow-glow: 0 0 30px rgba(91,155,213,0.08);
    --shadow-card: 0 4px 24px rgba(0,0,0,0.3);
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Background animated grid */
  .bg-grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(rgba(91,155,213,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(91,155,213,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 70%);
  }

  .bg-glow-1 {
    position: fixed;
    top: -200px;
    left: -100px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(91,155,213,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    animation: floatGlow 8s ease-in-out infinite;
  }

  .bg-glow-2 {
    position: fixed;
    bottom: -200px;
    right: -100px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(229,193,138,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    animation: floatGlow 10s ease-in-out infinite reverse;
  }

  @keyframes floatGlow {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -20px) scale(1.05); }
    66% { transform: translate(-20px, 10px) scale(0.95); }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 32px 0 40px;
  }

  .header-title {
    font-size: clamp(24px, 4vw, 36px);
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #7BB5E8, #E5C18A);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  .header-subtitle {
    font-size: 14px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .header-divider {
    width: 80px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent-blue), var(--accent-orange), transparent);
    margin: 16px auto 0;
    border-radius: 2px;
  }

  /* Weather Cards Grid */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
  }

  .weather-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    cursor: default;
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(20px);
    animation: cardFadeIn 0.6s ease-out forwards;
    animation-delay: var(--card-delay, 0s);
  }

  .weather-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent-blue), var(--accent-orange));
    transform: scaleX(0);
    transition: transform 0.4s ease;
    transform-origin: left;
  }

  .weather-card:hover {
    transform: translateY(-8px);
    box-shadow: var(--shadow-glow), var(--shadow-card);
    border-color: rgba(91,155,213,0.3);
    background: var(--bg-card-hover);
  }

  .weather-card:hover::before {
    transform: scaleX(1);
  }

  @keyframes cardFadeIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .card-city {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .card-city-name {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .card-city-tag {
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 20px;
    background: rgba(91,155,213,0.1);
    color: var(--accent-blue);
    border: 1px solid rgba(91,155,213,0.2);
    letter-spacing: 1px;
  }

  .card-temp-main {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 6px;
  }

  .card-temp-value {
    font-size: 48px;
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(180deg, #e2e8f0 0%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .card-temp-unit {
    font-size: 16px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .card-feels-like {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .card-details {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .detail-item {
    text-align: center;
    padding: 10px 6px;
    background: rgba(255,255,255,0.02);
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.04);
  }

  .detail-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .detail-value {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .detail-unit {
    font-size: 11px;
    color: var(--text-muted);
  }

  .card-advice {
    margin-top: 16px;
    padding: 12px 14px;
    background: rgba(91,155,213,0.05);
    border-radius: 10px;
    border-left: 3px solid var(--accent-blue);
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  .card-advice-label {
    color: var(--accent-orange);
    font-weight: 600;
    margin-right: 6px;
  }

  /* Charts Section */
  .charts-section {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
    margin-bottom: 32px;
  }

  .chart-panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    position: relative;
    overflow: hidden;
  }

  .chart-panel::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(91,155,213,0.3), transparent);
  }

  .chart-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  .chart-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 24px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .chart-svg-container {
    width: 100%;
    overflow-x: auto;
  }

  /* Line chart animations */
  .line-path {
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: drawLine 2s ease-out forwards;
  }

  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }

  .data-point {
    opacity: 0;
    animation: pointFadeIn 0.5s ease-out forwards;
  }

  @keyframes pointFadeIn {
    to { opacity: 1; }
  }

  /* Bar chart animations */
  .bar-rect {
    transform: scaleY(0);
    transform-origin: bottom;
    animation: barGrow 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: var(--bar-delay);
  }

  @keyframes barGrow {
    to { transform: scaleY(1); }
  }

  /* Legend */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 16px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Recommendation Panel */
  .recommend-panel {
    background: linear-gradient(135deg, rgba(91,155,213,0.08) 0%, rgba(229,193,138,0.08) 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    position: relative;
    overflow: hidden;
    animation: panelGlow 4s ease-in-out infinite;
  }

  @keyframes panelGlow {
    0%, 100% { box-shadow: 0 0 20px rgba(91,155,213,0.05); }
    50% { box-shadow: 0 0 40px rgba(91,155,213,0.12); }
  }

  .recommend-panel::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: conic-gradient(from 0deg, transparent, rgba(91,155,213,0.03), transparent, rgba(229,193,138,0.03), transparent);
    animation: rotateGlow 20s linear infinite;
  }

  @keyframes rotateGlow {
    to { transform: rotate(360deg); }
  }

  .recommend-content {
    position: relative;
    z-index: 1;
  }

  .recommend-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .recommend-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent-blue), #1B4D72);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }

  .recommend-title {
    font-size: 22px;
    font-weight: 700;
  }

  .recommend-badge {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(229,193,138,0.15);
    color: var(--accent-orange);
    border: 1px solid rgba(229,193,138,0.3);
  }

  .recommend-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }

  .recommend-card {
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 18px;
    transition: all 0.3s ease;
  }

  .recommend-card:hover {
    background: rgba(0,0,0,0.35);
    border-color: rgba(91,155,213,0.2);
    transform: translateY(-2px);
  }

  .recommend-card-city {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .recommend-card-score {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, #5B9BD5, #E5C18A);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .recommend-card-reason {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  .recommend-card-rank {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 32px 0 16px;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .cards-grid {
      grid-template-columns: 1fr;
    }
    .charts-section {
      grid-template-columns: 1fr;
    }
    .recommend-grid {
      grid-template-columns: 1fr 1fr;
    }
    .card-details {
      grid-template-columns: repeat(3, 1fr);
    }
    .weather-card {
      padding: 18px;
    }
    .card-temp-value {
      font-size: 38px;
    }
  }

  @media (max-width: 480px) {
    .recommend-grid {
      grid-template-columns: 1fr;
    }
    .container {
      padding: 12px 12px 24px;
    }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow-1"></div>
<div class="bg-glow-2"></div>

<div class="container">

  <!-- Header -->
  <header class="header">
    <h1 class="header-title">四川旅游城市天气对比看板</h1>
    <p class="header-subtitle">2026年6月15日 — 6月21日 &middot; 七日气象数据</p>
    <div class="header-divider"></div>
  </header>

  <!-- Weather Cards -->
  <div class="cards-grid" id="cardsGrid">
  </div>

  <!-- Charts Section -->
  <div class="charts-section">
    <!-- Temperature Trend SVG Chart -->
    <div class="chart-panel">
      <div class="chart-title">七日温度趋势</div>
      <div class="chart-subtitle">每日最高温度对比 &middot; 折线图</div>
      <div class="chart-svg-container">
        <svg id="tempChart" viewBox="0 0 720 360" style="width:100%;max-width:720px;"></svg>
      </div>
      <div class="legend" id="tempLegend"></div>
    </div>

    <!-- Precipitation Bar Chart -->
    <div class="chart-panel">
      <div class="chart-title">降水概率对比</div>
      <div class="chart-subtitle">七日平均降水概率 &middot; 条形图</div>
      <svg id="precipChart" viewBox="0 0 400 360" style="width:100%;max-width:400px;"></svg>
    </div>
  </div>

  <!-- Recommendation Panel -->
  <div class="recommend-panel">
    <div class="recommend-content">
      <div class="recommend-header">
        <div class="recommend-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
          </svg>
        </div>
        <div>
          <div class="recommend-title">出行综合推荐</div>
          <span class="recommend-badge">基于多维度评分</span>
        </div>
      </div>
      <div class="recommend-grid" id="recommendGrid"></div>
    </div>
  </div>

  <div class="footer">
    数据基于历史同期气象模型推算 &middot; 仅供参考
  </div>

</div>

<script>
// ============================================================
// Weather Data: 7 cities, 7 days (June 15-21, 2026)
// ============================================================
const cities = [
  {
    id: 'chengdu',
    name: '成都',
    tag: '平原都市',
    temps: [28,29,31,30,28,27,29],
    feelsLike: [30,31,33,32,30,29,31],
    humidity: [72,68,65,70,75,78,73],
    wind: [2,3,2,2,3,2,2],
    uv: [6,7,7,6,5,5,6],
    precipProb: [20,15,10,25,30,35,25],
    advice: '轻便夏装，备薄外套应对空调环境。午后偶有阵雨，建议携带折叠伞。'
  },
  {
    id: 'dujiangyan',
    name: '都江堰',
    tag: '水利古城',
    temps: [26,27,28,27,25,24,26],
    feelsLike: [28,29,30,29,27,26,28],
    humidity: [78,75,72,76,80,82,79],
    wind: [2,2,3,2,2,2,2],
    uv: [5,6,6,5,4,4,5],
    precipProb: [30,25,20,35,40,45,35],
    advice: '湿度较高，建议速干衣裤。景区植被茂密，备防蚊用品。'
  },
  {
    id: 'leshan',
    name: '乐山',
    tag: '佛都江畔',
    temps: [30,32,33,31,29,28,30],
    feelsLike: [33,35,36,34,32,30,33],
    humidity: [68,65,62,67,70,72,69],
    wind: [2,2,3,2,2,2,2],
    uv: [7,8,8,7,6,5,7],
    precipProb: [15,10,5,20,25,30,20],
    advice: '气温偏高，建议短袖短裤。大佛景区台阶多，穿舒适运动鞋。'
  },
  {
    id: 'emeishan',
    name: '峨眉山',
    tag: '佛教名山',
    temps: [18,20,22,21,19,17,19],
    feelsLike: [16,18,20,19,17,15,17],
    humidity: [82,80,78,81,85,88,84],
    wind: [4,3,4,3,4,4,3],
    uv: [8,9,9,8,7,6,8],
    precipProb: [40,35,30,45,50,55,45],
    advice: '山顶温差大，备冲锋衣及保暖层。紫外线强，务必防晒。'
  },
  {
    id: 'daocheng',
    name: '稻城',
    tag: '高原秘境',
    temps: [12,14,16,15,13,11,14],
    feelsLike: [9,11,13,12,10,8,11],
    humidity: [45,42,40,44,48,50,46],
    wind: [5,4,5,4,5,5,4],
    uv: [10,11,11,10,9,9,10],
    precipProb: [10,5,5,15,20,25,15],
    advice: '高原气候，早晚寒冷。羽绒服必备，注意高反，备氧气瓶。'
  },
  {
    id: 'siguniang',
    name: '四姑娘山',
    tag: '蜀山皇后',
    temps: [8,10,12,11,9,7,10],
    feelsLike: [4,6,8,7,5,3,6],
    humidity: [52,50,48,53,56,58,54],
    wind: [6,5,6,5,6,6,5],
    uv: [11,12,12,11,10,9,11],
    precipProb: [15,10,10,20,25,30,20],
    advice: '高海拔山区，冲锋衣+抓绒+保暖内衣。紫外线极强，全副武装防晒。'
  },
  {
    id: 'jiuzhaigou',
    name: '九寨沟',
    tag: '人间仙境',
    temps: [22,24,25,23,21,20,23],
    feelsLike: [20,22,23,21,19,18,21],
    humidity: [65,62,60,64,68,70,66],
    wind: [3,3,2,3,3,3,2],
    uv: [7,8,8,7,6,5,7],
    precipProb: [25,20,15,30,35,40,30],
    advice: '沟内温差大，叠穿法最佳。景区步行距离长，穿舒适徒步鞋。'
  }
];

const days = ['6/15', '6/16', '6/17', '6/18', '6/19', '6/20', '6/21'];

// Color palette for each city
const cityColors = [
  '#7BB5E8', // 成都 - blue
  '#A8D8B9', // 都江堰
  '#E5C18A', // 乐山 - orange
  '#B8A9D4', // 峨眉山
  '#F0C8D8', // 稻城
  '#8FD0E8', // 四姑娘山
  '#D4A76A', // 九寨沟
];

// ============================================================
// Render Weather Cards
// ============================================================
function renderCards() {
  const grid = document.getElementById('cardsGrid');
  let html = '';

  cities.forEach((city, idx) => {
    const todayTemp = city.temps[2]; // June 17 as "today" (mid-week)
    const todayFeels = city.feelsLike[2];
    const avgHumidity = Math.round(city.humidity.reduce((a,b)=>a+b)/7);
    const avgWind = Math.round(city.wind.reduce((a,b)=>a+b)/7);
    const maxUV = Math.max(...city.uv);

    html += `
      <div class="weather-card" style="--card-delay: ${idx * 0.1}s">
        <div class="card-city">
          <span class="card-city-name">${city.name}</span>
          <span class="card-city-tag">${city.tag}</span>
        </div>
        <div class="card-temp-main">
          <span class="card-temp-value">${todayTemp}°</span>
          <span class="card-temp-unit">C</span>
        </div>
        <div class="card-feels-like">体感温度 ${todayFeels}°C &middot; 多云间晴</div>
        <div class="card-details">
          <div class="detail-item">
            <div class="detail-label">湿度</div>
            <div class="detail-value">${avgHumidity}<span class="detail-unit">%</span></div>
          </div>
          <div class="detail-item">
            <div class="detail-label">风力</div>
            <div class="detail-value">${avgWind}<span class="detail-unit">级</span></div>
          </div>
          <div class="detail-item">
            <div class="detail-label">紫外线</div>
            <div class="detail-value">${maxUV}<span class="detail-unit">级</span></div>
          </div>
        </div>
        <div class="card-advice">
          <span class="card-advice-label">穿衣建议</span>${city.advice}
        </div>
      </div>
    `;
  });

  grid.innerHTML = html;
}

// ============================================================
// Render Temperature Trend SVG Chart
// ============================================================
function renderTempChart() {
  const svg = document.getElementById('tempChart');
  const W = 720, H = 360;
  const padLeft = 60, padRight = 30, padTop = 30, padBottom = 50;
  const chartW = W - padLeft - padRight;
  const chartH = H - padTop - padBottom;

  // Find global min/max for Y scale
  let allTemps = [];
  cities.forEach(c => { allTemps = allTemps.concat(c.temps); });
  const yMin = Math.min(...allTemps) - 3;
  const yMax = Math.max(...allTemps) + 3;

  function xPos(i) { return padLeft + (i / (days.length - 1)) * chartW; }
  function yPos(v) { return padTop + chartH - ((v - yMin) / (yMax - yMin)) * chartH; }

  let svgContent = '';

  // Grid lines
  for (let i = 0; i <= 5; i++) {
    const y = padTop + (chartH / 5) * i;
    const val = yMax - ((yMax - yMin) / 5) * i;
    svgContent += `
      <line x1="${padLeft}" y1="${y}" x2="${padLeft + chartW}" y2="${y}"
        stroke="rgba(255,255,255,0.04)" stroke-dasharray="4,4"/>
      <text x="${padLeft - 8}" y="${y + 4}" text-anchor="end"
        fill="#64748b" font-size="11" font-family="inherit">${Math.round(val)}°</text>
    `;
  }

  // X axis labels
  days.forEach((d, i) => {
    svgContent += `
      <text x="${xPos(i)}" y="${H - 15}" text-anchor="middle"
        fill="#64748b" font-size="12" font-family="inherit">${d}</text>
    `;
  });

  // Data lines
  cities.forEach((city, ci) => {
    let pathD = '';
    city.temps.forEach((t, i) => {
      pathD += (i === 0 ? 'M' : 'L') + ` ${xPos(i)} ${yPos(t)}`;
    });

    svgContent += `
      <path d="${pathD}" fill="none" stroke="${cityColors[ci]}" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"
        class="line-path" style="animation-delay: ${ci * 0.3}s; stroke-dasharray: ${chartW * 1.2};"/>
    `;

    // Data points
    city.temps.forEach((t, i) => {
      svgContent += `
        <circle cx="${xPos(i)}" cy="${yPos(t)}" r="4" fill="${cityColors[ci]}"
          class="data-point" style="animation-delay: ${ci * 0.3 + 0.5}s;"/>
        <circle cx="${xPos(i)}" cy="${yPos(t)}" r="7" fill="none" stroke="${cityColors[ci]}"
          stroke-width="1.5" opacity="0.5"
          class="data-point" style="animation-delay: ${ci * 0.3 + 0.5}s;"/>
        <text x="${xPos(i)}" y="${yPos(t) - 12}" text-anchor="middle"
          fill="${cityColors[ci]}" font-size="11" font-weight="600" font-family="inherit"
          class="data-point" style="animation-delay: ${ci * 0.3 + 0.7}s;">${t}°</text>
      `;
    });
  });

  // Axis lines
  svgContent += `
    <line x1="${padLeft}" y1="${padTop}" x2="${padLeft}" y2="${padTop + chartH}"
      stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <line x1="${padLeft}" y1="${padTop + chartH}" x2="${padLeft + chartW}" y2="${padTop + chartH}"
      stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  `;

  svg.innerHTML = svgContent;

  // Legend
  const legendDiv = document.getElementById('tempLegend');
  legendDiv.innerHTML = cities.map((c, i) => `
    <div class="legend-item">
      <span class="legend-dot" style="background:${cityColors[i]};"></span>
      ${c.name}
    </div>
  `).join('');
}

// ============================================================
// Render Precipitation Bar Chart
// ============================================================
function renderPrecipChart() {
  const svg = document.getElementById('precipChart');
  const W = 400, H = 360;
  const padLeft = 80, padRight = 30, padTop = 20, padBottom = 30;
  const chartW = W - padLeft - padRight;
  const chartH = H - padTop - padBottom;

  // Sort cities by avg precipitation probability
  const sorted = cities.map((c, i) => ({
    name: c.name,
    avg: Math.round(c.precipProb.reduce((a,b)=>a+b)/7),
    color: cityColors[i]
  })).sort((a, b) => b.avg - a.avg);

  const maxVal = Math.max(...sorted.map(s => s.avg));
  const barH = Math.min(28, chartH / sorted.length - 8);

  let svgContent = '';

  // Grid
  for (let i = 0; i <= 4; i++) {
    const x = padLeft + (chartW / 4) * i;
    const val = Math.round((maxVal / 4) * i);
    svgContent += `
      <line x1="${x}" y1="${padTop}" x2="${x}" y2="${padTop + chartH}"
        stroke="rgba(255,255,255,0.04)" stroke-dasharray="4,4"/>
      <text x="${x}" y="${H - 8}" text-anchor="middle"
        fill="#64748b" font-size="11" font-family="inherit">${val}%</text>
    `;
  }

  // Bars
  sorted.forEach((s, i) => {
    const barY = padTop + i * (chartH / sorted.length) + 4;
    const barWidth = (s.avg / maxVal) * chartW;
    const barFullH = chartH / sorted.length - 8;

    svgContent += `
      <text x="${padLeft - 8}" y="${barY + barFullH/2 + 4}" text-anchor="end"
        fill="#94a3b8" font-size="13" font-family="inherit" font-weight="500">${s.name}</text>
      <rect x="${padLeft}" y="${barY}" width="${barWidth}" height="${barFullH}"
        rx="4" fill="url(#barGrad-${i})"
        class="bar-rect" style="--bar-delay: ${i * 0.12}s"/>
      <text x="${padLeft + barWidth + 8}" y="${barY + barFullH/2 + 4}"
        fill="${s.color}" font-size="12" font-weight="600" font-family="inherit"
        class="data-point" style="animation-delay: ${i * 0.12 + 0.5}s;">${s.avg}%</text>
    `;
  });

  // Gradient defs
  let defsContent = '';
  sorted.forEach((s, i) => {
    defsContent += `
      <linearGradient id="barGrad-${i}" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="${s.color}" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="${s.color}" stop-opacity="1"/>
      </linearGradient>
    `;
  });

  svg.innerHTML = `<defs>${defsContent}</defs>${svgContent}`;
}

// ============================================================
// Render Recommendation Panel
// ============================================================
function renderRecommend() {
  const grid = document.getElementById('recommendGrid');

  // Calculate scores: temperature comfort (18-26 optimal), low precip, moderate UV, low humidity
  const scored = cities.map((city, ci) => {
    const avgTemp = city.temps.reduce((a,b)=>a+b)/7;
    const avgPrecip = city.precipProb.reduce((a,b)=>a+b)/7;
    const avgHum = city.humidity.reduce((a,b)=>a+b)/7;
    const maxUV = Math.max(...city.uv);

    // Temp score: optimal 18-26, penalty outside
    let tempScore = 100;
    if (avgTemp < 18) tempScore = 100 - (18 - avgTemp) * 4;
    else if (avgTemp > 26) tempScore = 100 - (avgTemp - 26) * 3;
    tempScore = Math.max(0, Math.min(100, tempScore));

    // Precip score: lower is better
    const precipScore = 100 - avgPrecip;

    // Humidity score: optimal 40-60
    let humScore = 100;
    if (avgHum < 40) humScore = 100 - (40 - avgHum) * 2;
    else if (avgHum > 60) humScore = 100 - (avgHum - 60) * 1.5;
    humScore = Math.max(0, Math.min(100, humScore));

    // UV score: lower is better for travel
    const uvScore = 100 - maxUV * 8;

    const totalScore = Math.round(
      tempScore * 0.35 + precipScore * 0.30 + humScore * 0.20 + uvScore * 0.15
    );

    // Reason
    let reason = '';
    if (avgTemp >= 18 && avgTemp <= 26) reason = '温度舒适宜人';
    else if (avgTemp > 26) reason = '气温稍高但可接受';
    else reason = '温度偏低，注意保暖';

    if (avgPrecip < 20) reason += '，降水概率低';
    else if (avgPrecip < 35) reason += '，偶有阵雨';
    else reason += '，需备雨具';

    return {
      name: city.name,
      tag: city.tag,
      score: totalScore,
      reason: reason,
      color: cityColors[ci]
    };
  });

  // Sort by score descending
  scored.sort((a, b) => b.score - a.score);

  let html = '';
  scored.forEach((s, i) => {
    const rankLabels = ['首选推荐', '强烈推荐', '推荐出行', '可以考虑', '谨慎出行', '不太适宜', '暂不推荐'];
    html += `
      <div class="recommend-card">
        <div class="recommend-card-rank">#${i + 1} ${rankLabels[i] || ''}</div>
        <div class="recommend-card-city">${s.name} <span style="font-size:12px;color:#64748b;font-weight:400;">${s.tag}</span></div>
        <div class="recommend-card-score">${s.score}分</div>
        <div class="recommend-card-reason">${s.reason}</div>
      </div>
    `;
  });

  grid.innerHTML = html;
}

// ============================================================
// Initialize
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  renderCards();
  renderTempChart();
  renderPrecipChart();
  renderRecommend();
});
</script>
